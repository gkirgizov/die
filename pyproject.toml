[project]
name = "die"
version = "0.1.0"
description = "Distributed Intelligence Environment — an Artificial Life project: learning cellular automata agents under environmental pressures"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "xarray>=2024.6",
    "perlin-noise>=1.13",
    "gymnasium>=1.0",
    "torch>=2.4",
    "matplotlib>=3.9",
    "imageio>=2.34",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "evotorch==0.6.1",
    "mlflow>=3.1",
]
video = [
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
die = "die.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/die"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running behavioral tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E741",  # ambiguous variable names -- math-heavy code uses short names
    "B905",  # zip() without strict= -- existing pairings rely on default semantics
]
