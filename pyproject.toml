[project]
name = "die"
version = "0.1.0"
description = "Distributed Intelligence Environment — an Artificial Life project: learning cellular automata agents under environmental pressures"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "xarray>=2024.6",
    "perlin-noise>=1.13",
    "gymnasium>=1.0",
    "torch>=2.4",
    "matplotlib>=3.9",
    "imageio>=2.34",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    # JAX stack -- the default training path (see docs/NOTES.md roadmap)
    "jax>=0.5",
    "flax>=0.10",
    "optax>=0.2",
    "evosax>=0.2,<0.3",
    "mlflow>=3.1",
]
# Legacy torch search path, kept as an alternate SearcherBackend.
train-evotorch = [
    "evotorch==0.6.1",
]
# NVIDIA GPU acceleration for the JAX training path. The CUDA wheels are
# linux-x86_64 only, so the marker keeps `uv sync --all-extras` working on
# macOS (where it resolves to nothing) -- see docs/NOTES.md on Apple GPUs.
# Use jax[cuda13] instead if your driver is CUDA 13.
train-cuda = [
    "jax[cuda12]>=0.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
video = [
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
die = "die.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/die"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running behavioral tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E741",  # ambiguous variable names -- math-heavy code uses short names
    "B905",  # zip() without strict= -- existing pairings rely on default semantics
]
